name: a-share-2026-tests

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pack extras
        run: |
          python -m pip install -U pip
          pip install -e ".[pack]"
      - name: Build Windows exe
        run: python -m PyInstaller ashare2026.spec --noconfirm
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AShare2026-windows
          path: dist/AShare2026/
          if-no-files-found: error
          retention-days: 30
      - name: Comment artifact link on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const marker = "<!-- ashare2026-windows-artifact -->";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              marker,
              "Windows 绿色版已由 GitHub Actions 构建。",
              "",
              `1. 打开本次运行：${runUrl}`,
              "2. 页面底部 **Artifacts** 下载 `AShare2026-windows`",
              "3. 解压后双击 `AShare2026.exe`（须保留同目录全部文件）",
              "4. 浏览器打开 http://127.0.0.1:8000",
              "",
              "需要联网拉取行情。产物保留 30 天。",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const found = comments.find((c) => c.body && c.body.includes(marker));
            if (found) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: found.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
